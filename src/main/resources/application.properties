# Pasal POS Configuration

# Database Configuration
database.url=jdbc:sqlite:./data/posdb.db
database.user=
database.password=
database.driver=org.sqlite.JDBC

# Database Backup Configuration
backup.enabled=false
backup.intervalMinutes=15
backup.directory=
backup.retention.hourly=24
backup.retention.daily=30
backup.retention.monthly=12
backup.retention.snapshotCount=20

# Printer Configuration (Windows Print API)
# Queue name(s) as in "wmic printer get name" / Settings -> Printers & scanners.
# Comma-separated: first match wins. We pick this queue even if it is not the
# Windows default.
# When the device is registered to a store, Hardware Settings can save a
# per-store queue name (overrides printer.name for that store only).
printer.name=POS-58C
# Optional alternates: printer.name=POS-80C, RONGTA RP80 Printer

# Cash Drawer Configuration (via printer RJ11 port)
# Most cash drawers use pin 2, some use pin 5
cashdrawer.kickPin=2

# PAX POSLink 2 Payment Terminal (semi-integrated card processing)
# Copy POSLink 2 JARs into lib/pax/ — see lib/pax/README.md
pax.enabled=true
pax.comm.type=TCP
pax.comm.host=10.211.55.3
pax.comm.port=10009
pax.comm.timeoutMs=60000
pax.log.enabled=true

# Application Settings
app.name=Pasal POS 2
app.version=2.0.0
app.company=Your Company Name
# Releases repo for this side-by-side test app (must be separate from the production POS).
app.github.repo=bargain-market/pasal-pos-2

# Auto-update Configuration
# Set to true to enable automatic update checks
# Set to false to disable auto-update functionality
app.autoupdate.enabled=false

# Logging
logging.level=INFO

# Backend API Configuration
backend.api.url=http://localhost:3000/api/v1
backend.api.timeout.connect=10000
backend.api.timeout.read=30000
backend.api.timeout.startup=4000
backend.api.retry.maxAttempts=3
backend.api.retry.delayMs=1000

# WebSocket Configuration
# WebSocket will automatically derive URL from backend.api.url
# Override websocket.url only if needed (e.g., separate WebSocket server)
# websocket.url=ws://localhost:3000
websocket.connect.timeoutMs=10000
websocket.reconnect.maxAttempts=10
websocket.reconnect.delayMs=1000
websocket.reconnect.maxDelayMs=30000
websocket.heartbeat.intervalMs=25000

# Sync Configuration (reduced intervals due to WebSocket real-time updates)
sync.inbound.intervalMinutes=15
sync.outbound.intervalSeconds=60
sync.connectivity.checkSeconds=30

# Customer Display (Second Monitor) Configuration
# Set to true to enable customer-facing display on secondary monitor
# Set to false to disable even if second monitor is detected
customer.display.enabled=false

# Testing Mode Configuration
# When enabled, receipts are saved as PDF without requiring a physical printer
# and displays success messages instead of printer errors
app.testing.mode=false

# Device Configuration
device.id=
store.id=
api.key=
api.secret=

# Scanner Configuration
# Set to true if your HP scanner works in keyboard wedge mode (USB HID)
# Most HP USB scanners send barcodes as keyboard input - no JavaPOS driver needed
scanner.useKeyboardMode=true
# Character that the scanner appends after barcode (usually Enter key)
scanner.keyboardMode.suffix=\n
# Timeout in ms to detect end of barcode input
scanner.keyboardMode.timeout=100

# Keyboard Configuration
# Built-in floating on-screen keyboard for touch input fields
app.keyboard.onscreen.enabled=true
# Allow physical keyboard input alongside the floating keyboard
app.keyboard.physical.enabled=true
